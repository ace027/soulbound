# Directory → domain → preferred agent mappings for The Soulbound Chronicles.
# Consumed by /legion:plan when recommending agents, and by /legion:build when
# constructing execution prompts.
map_schema_version: 1
generated_at: "2026-09-24"  # refreshed after Phase 5 + playtest fixes (commit 35ac809)

mappings:
  - path: shared/src
    domain: contract
    description: >-
      The World Voice JSON contract as Zod schemas plus derived JSON Schema, and the
      game-state types both sides share, and the access-gate constants. Single source of truth for
      CLAUDE.md constraint #4.
    preferred_agents: [engineering-backend-architect, orchestrator]
    touch_with_care: true

  - path: backend/src/data
    domain: prompt-data
    description: WORLD_SYSTEM_PROMPT and WORLD_LORE. Static, cacheable, balance-load-bearing.
    preferred_agents: [engineering-ai-engineer]
    touch_with_care: true

  - path: backend/src/routes
    domain: backend
    description: Three World Voice routes, one shared helper. Drift between them is this repo's historical failure mode.
    preferred_agents: [engineering-ai-engineer, engineering-backend-architect]

  - path: backend/src
    domain: backend
    description: >-
      Anthropic client, config (models, key, passphrase), Express app, access gate and rate
      limiter, untrusted-text guard. Middleware order in buildApp() is the security model.
    preferred_agents: [engineering-backend-architect, engineering-security-engineer]

  - path: frontend/src/lib
    domain: frontend-io
    description: >-
      Backend API client (Bearer header, checkAccess), localStorage saves and the stored
      passphrase. Save key names are byte-identical by requirement (R11).
    preferred_agents: [engineering-frontend-developer]

  - path: frontend/src/game
    domain: game-logic
    description: >-
      The pure turn logic (applyWorldUpdate) and the single entity-ledger merge (narrativeMemory,
      shared by the turn path and character creation). R10's balance rules live here and are
      mutation-tested.
    preferred_agents: [orchestrator, engineering-frontend-developer]
    touch_with_care: true

  - path: frontend/src/screens
    domain: frontend-screens
    description: Five phase screens, ported verbatim from the artifact. Inline styles are intentional.
    preferred_agents: [engineering-frontend-developer, design-ux-architect]

  - path: frontend/src/components
    domain: frontend-components
    description: >-
      Four presentational components, ported verbatim and prop-driven, plus AccessGate (Phase 5,
      new code), the one component that reaches storage and the API.
    preferred_agents: [engineering-frontend-developer]

  - path: frontend/src/data
    domain: static-data
    description: RACES (9) and QUESTIONS (5), extracted verbatim from the artifact.
    preferred_agents: [engineering-frontend-developer]

  - path: frontend/e2e
    domain: frontend-e2e
    description: >-
      Playwright smoke test — the ONLY place in this repo with a real layout engine. Asserts
      geometry (overflow, scrolling, action-bar position, no collapsed panel) that jsdom cannot see.
      Also covers the passphrase form. Runs under `test:e2e`, not `npm test`, and CI does not run it. Zero API calls by
      design: it seeds a localStorage save. Never run `npx playwright install` in the sandbox.
    preferred_agents: [engineering-frontend-developer]

  - path: .github/workflows
    domain: infrastructure
    description: >-
      ci.yml (build, test, image smoke) and release.yml (dispatch-only GHCR publish, main only,
      fail-closed overwrite and layer checks). The first publish has never run.
    preferred_agents: [engineering-infrastructure-devops, engineering-security-engineer]
    touch_with_care: true

  - path: scripts
    domain: infrastructure
    description: smoke-image.sh — 7 checks against a built image; shared by CI and release.
    preferred_agents: [engineering-infrastructure-devops]

  - path: backend/migrations
    domain: database
    description: >-
      Hosted-mode SQL migrations (node-pg-migrate, plain .sql with Up and Down sections). 001 is Better
      Auth's schema, generated by the CLI pinned to the installed better-auth version; 002 is ours
      (invites, account_deletions). Render's preDeployCommand applies them (node backend/dist/migrate.js),
      and the hosted app refuses to boot with any pending.
    preferred_agents: [engineering-backend-architect, engineering-infrastructure-devops]
    # Append-only once deployed: never edit or renumber an applied migration; add a new file instead.
    touch_with_care: true

  - path: docs/runbooks
    domain: operations
    description: >-
      Developer runbooks for steps that need the developer's own accounts (Render, Resend, OAuth apps,
      Sentry, UptimeRobot, the Anthropic Console). Each step has Do / Check / Status; a status says
      PASSED only after the agent's check has actually run.
    preferred_agents: [engineering-infrastructure-devops]

# REMOVED after Phase 4: the `legacy/` mapping. `legacy/souldbound-world.jsx` was the parity
# oracle and was deleted once parity was confirmed. 13 source files still cite its line numbers; those
# resolve via `git show 3d01fa5:legacy/souldbound-world.jsx`. Do not re-add the directory, and do
# not rebase this branch — nine documents reference that SHA by name.
