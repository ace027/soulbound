name: CI

# The test suite is the net that holds CLAUDE.md's hard constraints in place
# (max_tokens floor, the no-system-key path, the World Voice field contract).
# Before this workflow it ran only when someone remembered to run it.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres for the hosted suite (`test:hosted`, below). The password
    # is a throwaway value for this job-local container, NOT a secret: the
    # database holds only test schemas and dies with the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soulbound_test
        options: >-
          --health-cmd "pg_isready -U postgres -d soulbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - '5432:5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (all workspaces)
        run: npm run build

      # Runs with ANTHROPIC_API_KEY deliberately unset: the suite must pass
      # without a key, and no test may reach the real API. A test that starts
      # needing a key has stopped being a unit test.
      - name: Test
        run: npm test

      # The DB-backed hosted suite. Fails (never skips) without the database,
      # and fails on any skipped test. Throwaway credentials, as above.
      - name: Test (hosted, real Postgres)
        run: npm run test:hosted -w @soulbound/backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/soulbound_test

  # Proves the published image itself works — not just the source it's built
  # from — on every push, so a broken image can never reach main unnoticed
  # (Phase 5, R21). scripts/smoke-image.sh is the same script release.yml
  # runs before it ever pushes to GHCR: one definition of "the image works"
  # for both. Needs no secrets: the image is run with a bogus Anthropic key
  # and a throwaway passphrase, and makes zero calls to the real API.
  smoke-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f backend/Dockerfile -t soulbound:ci .

      - name: Smoke test image
        run: scripts/smoke-image.sh soulbound:ci
